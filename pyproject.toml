[project]
name = "lacrosse-stats"
version = "0.1.0"
description = "NCAA Division I men's lacrosse statistics pipeline"
requires-python = ">=3.11"
dependencies = [
	"beautifulsoup4>=4.14",
	"numpy>=1.24",
	"psycopg2-binary>=2.9",
	"python-dotenv>=1.1",
	"pytz>=2024.1",
	"requests>=2.32",
	"scipy>=1.10",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
]

[tool.setuptools]
packages = ["scripts", "scripts.loading", "scripts.fetching", "scripts.rankings", "scripts.utils"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
