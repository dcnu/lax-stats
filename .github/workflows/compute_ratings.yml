name: Compute Ratings

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season ID (e.g. 2026)"
        required: false
      backfill:
        description: "Backfill all weeks"
        type: boolean
        default: false

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv numpy scipy
      - name: Compute ratings
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then
            ARGS="--season ${{ inputs.season }}"
          fi
          if [ "${{ inputs.backfill }}" = "true" ]; then
            ARGS="$ARGS --backfill"
          fi
          python -m scripts.ratings.compute_ratings $ARGS
